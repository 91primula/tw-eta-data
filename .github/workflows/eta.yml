name: 에타 랭킹 수집

on:
  workflow_dispatch:
  schedule:
    # UTC 00:10 = 한국 시간 오전 09:10
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: eta-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: python -m pip install requests beautifulsoup4

      - name: 구글시트 닉네임 동기화
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ vars.GOOGLE_SHEET_GID }}
        run: python sync_nicknames.py

      - name: 넥슨 에타 랭킹 조회
        run: python collect_eta.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eta_ranking.json nicknames.txt
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Update ETA ranking data"
            git push
          fi
